<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
<!-- Tab icon: the house mark on a rounded chip, flipping with the reader's
     theme — cream chip and dark house by day, navy chip and cream house at
     night. The two delivered colourways (sisy-favicon.svg and
     sisy-favicon-navy.svg) are driven from this one file so a colour can
     never be changed in one and forgotten in the other.

     WHY A CHIP NOW. The mark this replaces was transparent, which made the
     icon's visibility depend on whatever tab strip sat behind it — a dark
     house measured 1.10:1 against a dark strip and vanished. An opaque chip
     carries its own ground: it reads on any strip in any browser, and the
     house always sits on its own high-contrast field.

     HOW IT WORKS. Presentation attributes carry the LIGHT colourway, so any
     renderer that ignores the style block still gets a correct, visible icon.
     The CSS below overrides them — CSS beats presentation attributes — and
     restates light explicitly so the two modes sit side by side and neither
     is implicit. The gold dot is constant: it reads on both grounds.

     KNOWN LIMIT: Safari does not honour prefers-color-scheme in SVG favicons,
     so it pins the light colourway in both modes. The chip makes that
     harmless — a cream chip is perfectly legible on a dark tab strip, which
     was not true of the transparent mark. The PNG icons (apple-touch-icon,
     icon-192/512) cannot be theme-aware at all; they keep a baked navy
     ground, matching this file's dark colourway. -->
<style>
  .chip  { fill:#FBF7EF }
  .house { fill:#1E2B36; stroke:#1E2B36 }
  .trend { stroke:#FBF7EF }
  @media (prefers-color-scheme: dark) {
    .chip  { fill:#1D3D5C }
    .house { fill:#FBF7EF; stroke:#FBF7EF }
    .trend { stroke:#1D3D5C }
  }
</style>
<rect class="chip" x="0" y="0" width="64" height="64" rx="14" fill="#FBF7EF"></rect>
<g transform="translate(9.6,9.6) scale(1.6)">
  <path class="house" d="M 3.5 12 L 14 3.5 L 24.5 12 L 24.5 24.5 L 3.5 24.5 Z" fill="#1E2B36" stroke="#1E2B36" stroke-width="2.6" stroke-linejoin="round"></path>
  <path class="trend" d="M 6.8 19.8 L 10.4 15.2 L 13.6 17.4 L 17.4 12.6" fill="none" stroke="#FBF7EF" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"></path>
  <circle cx="17.4" cy="12.6" r="2.7" fill="#DFA53C"></circle>
</g>
</svg>
