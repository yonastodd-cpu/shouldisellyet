<!-- The header/nav mark: logo-mark-dark.svg on its dark chip.

     Why not logo-mark.svg directly? Its house is #f0e2c4, which measures
     1.21:1 against this site's #faf8f4 page — the house frame disappears and
     you are left with a bell floating in nothing, losing the very element the
     new mark adds. logo-mark.svg is correct on white or on a photo; this
     site's background is cream, so the mark needs its own ground.

     Same artwork as favicon.svg, so the tab and the header agree. -->
