<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
<!-- Source for apple-touch-icon.png, and for icon-192/512.png.

     FULL BLEED, no rx: iOS applies its own squircle mask, and pre-rounded
     corners get rounded twice, leaving the original arcs visible as notches.
     Opaque because iOS composites transparency onto black.

     Navy ground is the delivered dark colourway (sisy-favicon-navy.svg), and
     the mark keeps that file's inset unchanged — its bounding box spans about
     83% of the canvas corner to corner, which the squircle clears comfortably.
     Android's tighter circular crop does not, which is why icon-maskable.svg
     exists as a separate file rather than a resize of this one.

     The explicit width/height are load-bearing: the rasterizer honours an
     SVG's intrinsic size, so without them it renders 64px of art into the
     corner of a 512px canvas. Regeneration commands are in icon-maskable.svg. -->
<rect width="64" height="64" fill="#1D3D5C"></rect>
<g transform="translate(9.6,9.6) scale(1.6)">
  <path d="M 3.5 12 L 14 3.5 L 24.5 12 L 24.5 24.5 L 3.5 24.5 Z" fill="#FBF7EF" stroke="#FBF7EF" stroke-width="2.6" stroke-linejoin="round"></path>
  <path d="M 6.8 19.8 L 10.4 15.2 L 13.6 17.4 L 17.4 12.6" fill="none" stroke="#1D3D5C" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"></path>
  <circle cx="17.4" cy="12.6" r="2.7" fill="#DFA53C"></circle>
</g>
</svg>
