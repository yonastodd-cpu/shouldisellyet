<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="180" height="180">
<!-- Source artwork for apple-touch-icon.png. Two differences from
     logo-mark-chip.svg, both because iOS treats this file differently:

     1. FULL BLEED, no rx. iOS applies its own squircle mask to home-screen
        icons. Shipping pre-rounded corners gets them rounded a second time,
        which leaves the original corner arcs visible as dark notches inside
        the mask. Square in, rounded by the OS.
     2. Art inset to ~82%. The squircle cuts further into the corners than a
        plain radius does, so the mark is pulled away from the edges to keep
        the roofline clear of the crop.

     Opaque on purpose as well: iOS composites transparent icons onto black,
     which would silently change the colour of anything translucent. -->
<rect width="56" height="56" fill="#141a14"></rect>
<g transform="translate(28,28) scale(0.82) translate(-28,-28)">
  <path d="M28 6 L51 25 L46 25 L46 48 L10 48 L10 25 L5 25 Z" fill="none" stroke="#f2f1ec" stroke-width="2.5" stroke-linejoin="round"></path>
  <g transform="translate(11.5,15) scale(0.63)"><path d="M26 7 C17.5 7 12.5 13.5 12.5 22 L12.5 31 L8.5 37.5 L43.5 37.5 L39.5 31 L39.5 22 C39.5 13.5 34.5 7 26 7 Z" fill="#f2f1ec" stroke="#141a14" stroke-width="5"></path><path d="M20.5 41.5 a5.5 5.5 0 0 0 11 0 Z" fill="#f2f1ec"></path><circle cx="39.5" cy="10.5" r="6.5" fill="#d99a2b"></circle></g>
</g>
</svg>
