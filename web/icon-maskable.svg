<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
<!-- Source for icon-maskable-512.png (Android adaptive icons).

     Android guarantees only the inner 80%-diameter CIRCLE; everything outside
     it may be cropped by the launcher's mask. At the delivered inset the
     mark's bounding box (including its 2.6 stroke) is 37.8 of 64 wide, so
     corner to corner it spans 37.8 × √2 ≈ 53.5 — about 83.5% of the canvas,
     just outside that guarantee. The 0.90 scale about the centre below brings
     it to roughly 75%, inside the safe circle with margin.

     That scale is the entire difference from apple-touch-icon.svg, and it is
     why the Android icon is not the iOS one resized: the iOS squircle crops
     less than Android's circle, so the same art is safe there and clipped here.

     REGENERATE THE PNGs (macOS, no extra tooling — there is no SVG rasterizer
     in this repo's toolchain, and CI never rebuilds these; they are committed
     artefacts). Note sips' short output flag: the long form spells out two
     hyphens, which XML forbids inside a comment and which silently turns this
     file into a parse error the rasterizer renders as a pink error card.
       qlmanage -t -s 512 -o /tmp/ico web/apple-touch-icon.svg web/icon-maskable.svg
       sips -z 180 180 /tmp/ico/apple-touch-icon.svg.png -o web/apple-touch-icon.png
       sips -z 192 192 /tmp/ico/apple-touch-icon.svg.png -o web/icon-192.png
       sips -z 512 512 /tmp/ico/apple-touch-icon.svg.png -o web/icon-512.png
       sips -z 512 512 /tmp/ico/icon-maskable.svg.png    -o web/icon-maskable-512.png -->
<rect width="64" height="64" fill="#1D3D5C"></rect>
<g transform="translate(32,32) scale(0.90) translate(-32,-32)">
  <g transform="translate(9.6,9.6) scale(1.6)">
    <path d="M 3.5 12 L 14 3.5 L 24.5 12 L 24.5 24.5 L 3.5 24.5 Z" fill="#FBF7EF" stroke="#FBF7EF" stroke-width="2.6" stroke-linejoin="round"></path>
    <path d="M 6.8 19.8 L 10.4 15.2 L 13.6 17.4 L 17.4 12.6" fill="none" stroke="#1D3D5C" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"></path>
    <circle cx="17.4" cy="12.6" r="2.7" fill="#DFA53C"></circle>
  </g>
</g>
</svg>
