name: Data refresh & deploy (when new data is published)

on:
  schedule:
    - cron: "0 13 * * 1,4"   # Mon & Thu 13:00 UTC — cheap check, full run only if data changed
  workflow_dispatch: {}       # manual run always rebuilds
  push:
    branches: [main]
    paths: ["web/**"]         # site-only changes deploy without re-running the pipeline

permissions:
  contents: write
  pages: write
  id-token: write

env:
  DATA_URL: https://redfin-public-data.s3.us-west-2.amazonaws.com/redfin_market_tracker/zip_code_market_tracker.tsv000.gz

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide rebuild vs deploy-only
        id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Site edit: deploy as-is, don't re-run the pipeline
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "deploy=true"  >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ETAG=$(curl -sI "$DATA_URL" | tr -d '\r' | awk -F'"' 'tolower($0) ~ /^etag:/ {print $2}')
          KNOWN=$(cat .redfin-etag 2>/dev/null || echo "none")
          echo "remote=$ETAG known=$KNOWN"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$ETAG" != "$KNOWN" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "deploy=true"  >> "$GITHUB_OUTPUT"
            echo "$ETAG" > .redfin-etag
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No new data — skipping rebuild."
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.changed == 'true'
        with:
          python-version: "3.12"

      - name: Snapshot previous verdicts
        if: steps.check.outputs.changed == 'true'
        run: cp -r web/data/zips /tmp/old_zips 2>/dev/null || mkdir -p /tmp/old_zips

      - name: Snapshot raw sources (archive)
        if: steps.check.outputs.changed == 'true'
        id: archive
        run: |
          set -euo pipefail
          MONTH=$(date -u +%Y-%m)
          DIR="archive/$MONTH"
          mkdir -p "$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"

          # Raw source files, exactly as published. The Redfin tracker is
          # ~1.5GB so it is NEVER committed — see the retention note below.
          curl -sSL --retry 3 -o "$DIR/zip_code_market_tracker.tsv000.gz" "$DATA_URL"
          curl -sSL --retry 3 -o "$DIR/RDC_Inventory_Core_Metrics_Zip.csv" \
            "https://econdata.s3-us-west-2.amazonaws.com/Reports/Core/RDC_Inventory_Core_Metrics_Zip.csv" || \
            echo "::warning::RDC archive fetch failed"
          curl -sSL --retry 3 -o "$DIR/PMMS_history.csv" \
            "https://www.freddiemac.com/pmms/docs/PMMS_history.csv" || \
            echo "::warning::PMMS archive fetch failed"

          # Compliance record: the terms page as published this month.
          # If this 403s from CI, the operator captures it manually
          # (archive.org + dated screenshot — see docs/ATTRIBUTION.md).
          curl -sSL --retry 2 -o "$DIR/redfin-data-center.html" \
            "https://www.redfin.com/news/data-center/" || \
            echo "::warning::TODO terms-page capture blocked from CI — capture manually"
          if [ ! -s "$DIR/redfin-data-center.html" ]; then
            echo "::warning::TODO terms-page capture empty — capture manually"
          fi
          ls -lh "$DIR"

      - name: Upload raw-source archive (2-year retention)
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: raw-sources-${{ steps.archive.outputs.month }}
          path: ${{ steps.archive.outputs.dir }}
          retention-days: 730
          compression-level: 0   # inputs are already compressed

      - name: Run pipeline (all states)
        if: steps.check.outputs.changed == 'true'
        run: python pipeline/fetch_data.py --input "${{ steps.archive.outputs.dir }}/zip_code_market_tracker.tsv000.gz"

      - name: Send verdict-change alerts (Supabase + Resend)
        if: steps.check.outputs.changed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python pipeline/notify_changes.py --old /tmp/old_zips --new web/data/zips

      - name: Check personal-number watches (Supabase + Resend)
        if: steps.check.outputs.changed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python pipeline/check_watches.py --data web/data
      - name: Run tests
        if: steps.check.outputs.changed == 'true'
        run: |
          pip install pytest
          pytest pipeline/ -q

      - name: Commit refreshed data
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "sisy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add web/data .redfin-etag   # archive/ is gitignored — artifacts only
          git diff --cached --quiet && { echo "no data change"; exit 0; }
          git commit -m "Data refresh $(date +%Y-%m-%d)"
          # A manual push can land on main while this run computes. Rebase our
          # single data commit onto the latest main and retry a few times so
          # concurrent pushes never fail the workflow.
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed"; exit 0; fi
            echo "push rejected — rebasing onto latest main (attempt $i)"
            git pull --rebase --autostash origin main || true
            sleep $((RANDOM % 5 + 2))
          done
          echo "::error::could not push data refresh after 5 attempts"; exit 1

      - name: Upload site
        if: steps.check.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: refresh
    if: needs.refresh.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
