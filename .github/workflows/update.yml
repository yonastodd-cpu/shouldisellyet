name: Data refresh & deploy (when new data is published)

on:
  schedule:
    - cron: "0 13 * * 1,4"   # Mon & Thu 13:00 UTC — cheap check, full run only if data changed
  workflow_dispatch: {}       # manual run always rebuilds
  push:
    branches: [main]
    # web/** — site changes deploy without re-running the pipeline.
    # pipeline/** — build code shapes the deployed output too (build_pages,
    # build_research, committed research data): the Research launch sat
    # undeployed because this filter only watched web/**. Bot commits from
    # inside this workflow carry [skip ci] so they cannot re-trigger it.
    # scripts/** matters: the browser smoke and the released-paths harness live
    # there, and without it a change to a GATE never runs the gate. A fix to
    # the smoke test sat unexercised because of exactly this — the push landed
    # and no run started.
    paths: ["web/**", "pipeline/**", "scripts/**"]

permissions:
  contents: write
  pages: write
  id-token: write

# The data-center hub layout (post-2026-06). The old redfin_market_tracker
# files froze 2026-06-02 when Redfin migrated; these are what the hub's own
# Download button fetches. See docs/DATA.md.
env:
  DATA_URL: https://redfin-public-data.s3.us-west-2.amazonaws.com/redfin_data_center/housing_market/monthly/all_zips.csv
  PRICE_DROPS_URL: https://redfin-public-data.s3.us-west-2.amazonaws.com/redfin_data_center/price_drops/monthly/all_zips.csv

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - uses: actions/checkout@v5

      - name: Decide rebuild vs deploy-only
        id: check
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Site edit: deploy as-is, don't re-run the pipeline
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "deploy=true"  >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # ————— REDFIN SUNSET, PHASE 0 (see pipeline/data_pause.py) —————
          # Ingestion is stopped. changed=false skips every step that fetches
          # from or computes on Redfin data; deploy=true keeps the site
          # rebuilding and shipping, because every generated directory is
          # gitignored and re-rendered each deploy — skipping the build would
          # DELETE live URLs, which this migration forbids.
          #
          # The ETag probe below is left in place but unreachable: it is the
          # only remaining Redfin network call in CI, and deleting it would
          # lose the record of how the gate worked. Restore by removing this
          # block, not by rewriting what follows.
          #
          # KNOWN SIDE EFFECT: eleven downstream steps are gated on `changed`
          # and do NOT touch Redfin — subscriber alert emails, the Supabase
          # velocity upsert, the marketing queue generator. They stop too.
          # That is correct for now: every one of them would publish or notify
          # on numbers Phase 0 just took down.
          echo "changed=false" >> "$GITHUB_OUTPUT"
          echo "deploy=true"  >> "$GITHUB_OUTPUT"
          exit 0

          ETAG=$(curl -sI "$DATA_URL" | tr -d '\r' | awk -F'"' 'tolower($0) ~ /^etag:/ {print $2}')
          KNOWN=$(cat .redfin-etag 2>/dev/null || echo "none")
          echo "remote=$ETAG known=$KNOWN"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$ETAG" != "$KNOWN" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "deploy=true"  >> "$GITHUB_OUTPUT"
            echo "$ETAG" > .redfin-etag
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "No new data — skipping rebuild."
          fi

      - uses: actions/setup-python@v6
        if: steps.check.outputs.deploy == 'true'
        with:
          python-version: "3.12"

      - name: Snapshot previous verdicts
        if: steps.check.outputs.changed == 'true'
        run: cp -r web/data/zips /tmp/old_zips 2>/dev/null || mkdir -p /tmp/old_zips

      - name: Snapshot raw sources (archive)
        if: steps.check.outputs.changed == 'true'
        id: archive
        run: |
          set -euo pipefail
          MONTH=$(date -u +%Y-%m)
          DIR="archive/$MONTH"
          mkdir -p "$DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "month=$MONTH" >> "$GITHUB_OUTPUT"

          # Raw source files, exactly as published. The Redfin files are
          # ~1GB together so they are NEVER committed — see the retention
          # note below.
          curl -sSL --retry 3 -o "$DIR/all_zips.csv" "$DATA_URL"
          curl -sSL --retry 3 -o "$DIR/price_drops_all_zips.csv" "$PRICE_DROPS_URL" || \
            echo "::warning::price-drops archive fetch failed"
          curl -sSL --retry 3 -o "$DIR/RDC_Inventory_Core_Metrics_Zip.csv" \
            "https://econdata.s3-us-west-2.amazonaws.com/Reports/Core/RDC_Inventory_Core_Metrics_Zip.csv" || \
            echo "::warning::RDC archive fetch failed"
          curl -sSL --retry 3 -o "$DIR/PMMS_history.csv" \
            "https://www.freddiemac.com/pmms/docs/PMMS_history.csv" || \
            echo "::warning::PMMS archive fetch failed"

          # Compliance record: the terms page as published this month.
          # Redfin rate-limits datacenter-agent traffic — a HEAD returns 200 but
          # the GET body is a bot wall ("Are You a Robot?", HTTP 429). Verified
          # 2026-08-02. So check CONTENT, not just that a file landed: a saved
          # block page is worse than no file, because it looks like a record.
          curl -sSL --retry 2 -o "$DIR/redfin-data-center.html" \
            "https://www.redfin.com/news/data-center/" || true

          # Same compliance record for the other two sources whose terms we
          # rely on. Realtor.com asks for a specific attribution string and
          # GeoNames data is CC BY — both can change, and "what did their
          # terms say when we shipped" needs an answer that is not memory.
          curl -sSL --retry 2 -o "$DIR/realtor-research-terms.html" \
            -A "Mozilla/5.0 (compatible; shouldisellyet-archive)" \
            "https://www.realtor.com/research/data/" || \
            echo "::warning::Realtor.com terms capture failed"
          curl -sSL --retry 2 -o "$DIR/geonames-license.html" \
            "https://creativecommons.org/licenses/by/4.0/" || \
            echo "::warning::CC BY 4.0 licence capture failed"
          if grep -qi "national real estate brokerage\|data center" "$DIR/redfin-data-center.html" 2>/dev/null; then
            echo "terms page captured ($(wc -c < "$DIR/redfin-data-center.html") bytes)"
          else
            rm -f "$DIR/redfin-data-center.html"
            echo "::warning::TODO terms-page capture blocked by Redfin bot protection — \
          operator must capture manually (archive.org + dated screenshot, see docs/ATTRIBUTION.md)"
          fi
          ls -lh "$DIR"

      - name: Upload raw-source archive (90-day retention)
        if: steps.check.outputs.changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: raw-sources-${{ steps.archive.outputs.month }}
          path: ${{ steps.archive.outputs.dir }}
          # 90 is the hard cap for public repos — GitHub silently reduces
          # anything larger. Longer retention needs an external bucket;
          # see docs/DATA.md.
          retention-days: 90
          # The hub CSVs are UNcompressed (unlike the old .gz tracker), so
          # let the artifact zip actually compress — ~1GB shrinks to ~200MB.
          compression-level: 6

      - name: Run pipeline (all states)
        if: steps.check.outputs.changed == 'true'
        run: |
          python pipeline/fetch_data.py \
            --input "${{ steps.archive.outputs.dir }}/all_zips.csv" \
            --price-drops "${{ steps.archive.outputs.dir }}/price_drops_all_zips.csv"

      - name: Send verdict-change alerts (Supabase + Resend)
        if: steps.check.outputs.changed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python pipeline/notify_changes.py --old /tmp/old_zips --new web/data/zips

      - name: Check personal-number watches (Supabase + Resend)
        if: steps.check.outputs.changed == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python pipeline/check_watches.py --data web/data
      # ShouldISellYet Research: append this month to the Warning-Sign Index
      # history, advance streaks, detect records, and write the per-month
      # research JSON. MUST run before the digest — the digest's "Research
      # release" section reads this month's research JSON. continue-on-error
      # for the same reason the digest is: the index is derived output, and
      # losing one month of it must never lose a deploy.
      - name: Research index (Warning-Sign Index)
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        run: python3 pipeline/research.py --data web/data

      # Approach velocity — months-to-line per signal, metro/state aggregates,
      # the gathering list. Committed aggregates only; per-ZIP payloads go to
      # Supabase in the next step (paywall boundary — see velocity.py header).
      - name: Approach velocity
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        run: python3 pipeline/velocity.py

      # Per-ZIP payloads → Supabase (the paid serving layer; schema-v20).
      # Forward validation — measured accuracy (or the honest collecting state
      # until 12 months of snapshots exist; first possible run 2027-05).
      - name: Forward validation
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        run: python3 pipeline/validation.py

      - name: Velocity upsert
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipeline/upsert_velocity.py

      # Marketing queue: turn this refresh's facts into suggested task rows
      # (public.marketing_tasks — nothing here posts or sends anything; the
      # queue is a list of things a human may choose to do). MUST run before
      # growth_digest.py so the digest reports THIS refresh's queue, not last
      # refresh's. continue-on-error for the same reason the digest carries
      # it: derived output must never cost a deploy. A fork without secrets
      # prints a dry-run plan and exits 0 by construction.
      - name: Marketing queue refresh
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipeline/marketing_tasks.py

      # Digest failure must never fail the refresh: the site data is already
      # good at this point and a broken marketing email is not worth losing a
      # deploy over. continue-on-error plus an explicit fallback notice.
      - name: Growth Ops digest
        id: digest
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPS_DIGEST_RECIPIENTS: ${{ secrets.OPS_DIGEST_RECIPIENTS }}
        run: python3 pipeline/growth_digest.py

      - name: Notify if the digest failed (refresh itself is fine)
        if: steps.check.outputs.changed == 'true' && steps.digest.outcome == 'failure'
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPS_DIGEST_RECIPIENTS: ${{ secrets.OPS_DIGEST_RECIPIENTS }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          key = os.environ.get("RESEND_API_KEY", "")
          to = [x.strip() for x in os.environ.get("OPS_DIGEST_RECIPIENTS", "").split(",") if x.strip()] \
               or ["hello@shouldisellyet.com"]
          if not key:
              raise SystemExit("no RESEND_API_KEY — cannot send the fallback notice")
          html = ("<p><b>Data refresh succeeded; the Growth Ops digest failed.</b></p>"
                  "<p>The site data and deploy are fine — only the digest email did not "
                  f"generate. Run log: <a href=\"{os.environ['RUN_URL']}\">{os.environ['RUN_URL']}</a></p>")
          req = urllib.request.Request(
              "https://api.resend.com/emails",
              data=json.dumps({"from": os.environ.get("ALERT_FROM",
                                                      "ShouldISellYet <support@shouldisellyet.com>"),
                               "to": to, "subject": "Refresh OK — Growth Ops digest failed",
                               "html": html}).encode(),
              method="POST",
              headers={"Authorization": f"Bearer {key}", "Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=30).read()
          print("fallback notice sent")
          PY

      - name: Commit verdict snapshot
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        run: |
          git config user.name "sisy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pipeline/snapshots pipeline/research pipeline/velocity pipeline/validation || true
          # pipeline/marketing/ holds the pack manifest post_pack.py renders
          # from at deploy time — it must ride the same snapshot commit.
          git add pipeline/marketing || true
          git add web/data/proof.json || true
          git diff --cached --quiet && { echo "no snapshot change"; exit 0; }
          git commit -m "Verdict snapshot + research index $(date +%Y-%m) [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase --autostash origin main || true
          done
          echo "::warning::snapshot push failed — next digest falls back to baseline"

      # Search engines can't find a new domain with no inbound links, so tell
      # them directly which pages changed rather than waiting for a crawl that
      # may never come. Non-fatal by design — see pipeline/indexnow.py.
      - name: Ping IndexNow with the changed ZIPs
        if: steps.check.outputs.changed == 'true'
        continue-on-error: true
        run: python3 pipeline/indexnow.py --old /tmp/old_zips --new web/data/zips

      - name: Commit refreshed data
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "sisy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add web/data .redfin-etag   # archive/ is gitignored — artifacts only
          git diff --cached --quiet && { echo "no data change"; exit 0; }
          git commit -m "Data refresh $(date +%Y-%m-%d) [skip ci]"
          # A manual push can land on main while this run computes. Rebase our
          # single data commit onto the latest main and retry a few times so
          # concurrent pushes never fail the workflow.
          for i in 1 2 3 4 5; do
            if git push; then echo "pushed"; exit 0; fi
            echo "push rejected — rebasing onto latest main (attempt $i)"
            git pull --rebase --autostash origin main || true
            sleep $((RANDOM % 5 + 2))
          done
          echo "::error::could not push data refresh after 5 attempts"; exit 1

      # Must run on every deploy, not just data refreshes: the Pages artifact is
      # the whole of web/, and these pages aren't committed. Building only on
      # refresh would make a site-only push deploy a web/ with no zip/ —
      # silently removing ~18.6k live URLs. Reads committed web/data only, so
      # it needs no download and takes ~4s.
      # web/data/zips is no longer committed — it is generated here from the
      # page manifest, plus readings pulled from the private store for ZIPs in
      # a released tranche. With no tranche released this writes 22,874
      # notice-only records and contacts nothing.
      #
      # If the store is unreachable this still writes every manifest record:
      # losing a reading degrades a page to its notice, losing a record
      # deletes a live URL, and those are not the same size of mistake.
      - name: Provision per-ZIP records
        if: steps.check.outputs.deploy == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipeline/provision_readings.py

      # AFTER provisioning, deliberately. web/data/zips is generated now, so a
      # suite that ran before it existed was testing a directory the deploy
      # would never see — and that is exactly how this step failed the first
      # time it was armed. Tests should assert against what actually ships.
      # Still before the build and the upload, so a failure blocks both.
      - name: Run tests
        if: steps.check.outputs.deploy == 'true'
        run: |
          pip install pytest
          pytest pipeline/ -q

      - name: Build ZIP pages, hubs, sitemaps and share cards
        if: steps.check.outputs.deploy == 'true'
        run: |
          # Pillow renders the OG share cards. Without it build_pages warns and
          # falls back to the brand card for every ZIP — silently losing the
          # per-ZIP previews — so install it rather than let that happen.
          pip install --quiet Pillow
          python3 pipeline/build_pages.py
          python3 pipeline/build_research.py
          # /metro/{slug} — the destination every metro post links to.
          # Must run BEFORE post_pack, which reads the slug map it writes.
          python3 pipeline/build_metro.py
          # /stories/{slug} — the cold-audience landing page. Reads the
          # committed case JSONs only; no Redfin fetch, unlike the PNG charts
          # in tools/backtest_cases.py that the methodology page uses.
          python3 pipeline/build_stories.py
          # Marketing cards, drawn from the committed pack manifest. Runs on
          # every deploy like the pages above, and for the same reason: the
          # output is gitignored, so a deploy that skipped it would upload a
          # web/ with dead <img> URLs on the admin queue.
          python3 pipeline/post_pack.py --render

      # The last thing standing between a broken build and ~23,000 deleted
      # URLs. Generated directories are rebuilt each deploy, so a short build
      # publishes a short site — count the pages against the manifest and
      # refuse to upload if they disagree.
      # The last thing between a broken build and mass URL deletion. Every
      # generated tree is rebuilt each deploy, so a short build publishes a
      # short site.
      #
      # It counted only web/zip at first, and that was not enough: metro pages
      # are generated from a DIFFERENT population and a bug there took 609
      # directories to 1 while the ZIP count stayed perfect. Every generated
      # tree needs its own floor, and the floors are the counts the site
      # publishes today.
      - name: Gate on page count
        if: steps.check.outputs.deploy == 'true'
        run: |
          fail=0
          want=$(awk -F, 'NR>1 && $3==1' pipeline/data/page_manifest.csv | wc -l | tr -d ' ')
          have=$(find web/zip -mindepth 1 -maxdepth 1 -type d -name '[0-9]*' | wc -l | tr -d ' ')
          echo "zip pages   — manifest: $want · built: $have"
          [ "$have" -lt "$want" ] && { echo "::error::built $have ZIP pages for $want manifest rows; would delete $((want - have)) live URLs."; fail=1; }

          for tree in metro stories; do
            n=$(find "web/$tree" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
            echo "$tree pages — built: $n"
          done
          m=$(find web/metro -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
          [ "$m" -lt 600 ] && { echo "::error::only $m metro directories built (expected ~609) — refusing to upload."; fail=1; }
          s=$(find web/stories -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
          [ "$s" -lt 1 ] && { echo "::error::no story pages built — refusing to upload."; fail=1; }
          r=$(find web/research -mindepth 1 -maxdepth 1 -type d 2>/dev/null | wc -l | tr -d ' ')
          [ "$r" -lt 2 ] && { echo "::error::only $r research releases built (expected 2+) — refusing to upload."; fail=1; }
          exit $fail

      # THE GATE EVERY OTHER GATE CANNOT BE. On 2026-08-19 the homepage ZIP
      # lookup threw inside a setTimeout and a visitor saw nothing at all —
      # while unit tests passed, the page-count gate passed, and curl returned
      # 200 on every URL. None of those execute JavaScript. This runs the built
      # site in a real browser and asserts a ZIP lookup ANSWERS, with no
      # uncaught exception. It is the only check in this pipeline that could
      # have caught that class of break.
      - name: Browser smoke test
        if: steps.check.outputs.deploy == 'true'
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          python3 -m http.server 5177 --directory web &
          for i in $(seq 1 20); do curl -sf http://localhost:5177/ >/dev/null && break; sleep 0.5; done
          node scripts/smoke-browser.mjs http://localhost:5177

      - name: Upload site
        if: steps.check.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web

  # The released render paths — `ok` and `insufficient_data` — are unreachable
  # in a normal build because nothing is released, which is how a bug in one of
  # them survived every other gate. This stages a release with FIXTURE readings
  # (synthetic numbers, no vendor call, no database write), renders those pages
  # and asserts them.
  #
  # A SEPARATE JOB ON PURPOSE. The harness mutates pipeline/tranches.json and
  # rebuilds pages in the working tree. Running it inside the deploy job would
  # mean a failure between staging and restoring could put a released ZIP into
  # the artifact. This job uploads nothing.
  verify-released:
    runs-on: ubuntu-latest
    needs: refresh
    if: needs.refresh.outputs.deploy == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Browser smoke — released paths
        run: |
          # Pillow, same as the build job — this job renders real pages.
          pip install --quiet Pillow
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
          python3 pipeline/provision_readings.py --no-readings
          ./scripts/smoke-released.sh

  deploy:
    needs: refresh
    if: needs.refresh.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
