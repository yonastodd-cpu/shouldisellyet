name: On-demand ZIP promotion (manual sweep)

# Folds ZIPs that were pulled at purchase time (public.zip_release rows with
# tranche='ondemand', written by the ondemand-pull edge function) into
# pipeline/tranches.json, so the next deploy builds their live pages, drops
# noindex and adds them to the sitemap — through the same gates every tranche
# page passes. See pipeline/promote_ondemand.py's header for why this is
# batched rather than per sale (sitemap churn, one gated deploy).
#
# MANUAL DISPATCH ONLY — operator decision 2026-08-26. The sweep publishes
# static pages and touches the sitemap, so the operator picks the moment.
# In the gap, pulled ZIPs are fully served from the API; only their static
# pages lag as notices.
#
# The ledger push CANNOT trigger update.yml by itself: GitHub never starts
# workflows from pushes made with the default GITHUB_TOKEN (loop prevention;
# observed live 2026-08-27 — run 33030464373 pushed fe019f3 and no build
# followed). workflow_dispatch via the API is the documented exception to
# that rule, so the last step dispatches the rebuild explicitly.
#
# Spends no vendor quota: this only reads back what purchase-time pulls
# already bought and stored.

on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # to dispatch update.yml after the ledger lands

concurrency:
  group: ondemand-promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sweep pulled ZIPs into tranches.json
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipeline/promote_ondemand.py

      - name: Commit the release ledger
        id: ledger
        run: |
          git config user.name "sisy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pipeline/tranches.json || true
          if git diff --cached --quiet; then
            echo "no promotion this sweep"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Promote on-demand ZIPs to live pages (manual sweep)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "push rejected — rebasing onto latest main (attempt $i)"
            git pull --rebase --autostash origin main || true
            sleep $((RANDOM % 5 + 2))
          done
          echo "::error::could not push tranches.json after 5 attempts — the \
          pulled ZIPs stay API-served but their static pages remain notices \
          until this lands. Re-run the workflow."
          exit 1

      - name: Dispatch the rebuild that publishes the pages
        if: steps.ledger.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update.yml --ref main
