name: Weekly jobs (rate watch + pre-renewal reminders)

on:
  schedule:
    - cron: "0 14 * * 5"   # Fridays 14:00 UTC, after Freddie Mac's Thursday PMMS release
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Silence is the expected outcome. This only emails when the 30-year rate
      # has moved >= 0.25 points since the last monthly digest's stamp.
      - name: Check the rate
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPS_DIGEST_RECIPIENTS: ${{ secrets.OPS_DIGEST_RECIPIENTS }}
        run: python3 pipeline/rate_watch.py

      # Advance notice before an annual subscription renews. Weekly cadence is
      # enough for a ~30-day window, and the job is idempotent PER PERIOD, so
      # running it every Friday cannot re-send the same notice.
      #
      # continue-on-error: a billing courtesy must never fail the workflow that
      # also carries the rate alert.
      - name: Pre-renewal reminders
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
        run: python3 pipeline/renewal_reminders.py

      # 90-day retention on raw analytics events (privacy posture: counts,
      # not history). Weekly is exactly as compliant as nightly — nothing
      # reads the boundary between runs.
      - name: Purge analytics events older than 90 days
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 pipeline/events_maintenance.py
